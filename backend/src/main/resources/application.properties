spring.application.name=cloud-task-manager-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/cloudtasks;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.storage.local-directory=${LOCAL_UPLOAD_DIRECTORY:uploads}

# Azure settings are read when SPRING_PROFILES_ACTIVE=azure
app.azure.storage-account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
app.azure.container-name=${AZURE_STORAGE_CONTAINER_NAME:app-uploads}
